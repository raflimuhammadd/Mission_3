<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chill – Streaming Film & Series</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Londrina+Solid:wght@100;300;400;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="app.js"></script>
  </head>
  <body>
    <!-- ===== Login Page ===== -->
    <div id="page-login" class="page page--active" role="main">
      <div class="auth-deco auth-deco--1"></div>
      <div class="auth-deco auth-deco--2"></div>

      <!-- Cinematic background -->
      <div class="auth-page__bg" aria-hidden="true">
        <img class="auth-page__bg-img" src="./assets/images/theatre3.jpg" alt="" />
        <div class="auth-page__bg-overlay"></div>
      </div>

      <div class="auth-page__inner">
        <div class="auth-page__logo"></div>

        <!-- CARD LOGIN -->
        <div class="auth-card">
          <div class="card-logo">
            <img src="./assets/images/chill-logo.png" alt="CHILL" />
          </div>
          <h1 class="auth-card__title">Masuk</h1>
          <p class="auth-card__subtitle">Selamat Datang Kembali!</p>

          <div class="auth-card__form">
            <div class="form-group">
              <label class="form-group__label" for="login-username">Username</label>
              <input
                class="form-group__input"
                type="text"
                id="login-username"
                name="username"
                placeholder="Masukkan username"
                autocomplete="username"
              />
            </div>

            <div class="form-group">
              <label class="form-group__label" for="login-password">Kata Sandi</label>
              <div class="form-group__input-wrap">
                <input
                  class="form-group__input"
                  type="password"
                  id="login-password"
                  name="password"
                  placeholder="Masukkan kata sandi"
                  autocomplete="current-password"
                />
                <button
                  class="form-group__toggle"
                  type="button"
                  aria-label="Tampilkan kata sandi"
                  onclick="togglePassword('login-password', this)"
                ></button>
              </div>
            </div>

            <div class="auth-card__links">
              <p class="auth-card__footer auth-card__footer--login">
                Belum punya akun?
                <a
                  href="#"
                  onclick="
                    showPage('register');
                    return false;
                  "
                  >Daftar sekarang</a
                >
              </p>
              <div class="auth-card__forgot">
                <a href="#" onclick="return false;">Lupa kata sandi?</a>
              </div>
            </div>

            <div class="auth-card__actions">
              <button
                class="btn btn--primary btn--full btn--lg"
                type="button"
                onclick="window.location.href = './home.html'"
              >
                Masuk
              </button>

              <div class="divider">atau</div>

              <button class="btn btn--google btn--full btn--lg" type="button">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4"
                  />
                  <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853"
                  />
                  <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                    fill="#FBBC05"
                  />
                  <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335"
                  />
                </svg>
                Masuk dengan Google
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ===== Register Page ===== -->
    <div id="page-register" class="page" role="main">
      <div class="auth-deco auth-deco--1"></div>
      <div class="auth-deco auth-deco--2"></div>

      <div class="auth-page__bg" aria-hidden="true">
        <img class="auth-page__bg-img" src="./assets/images/theatre4.jpg" alt="" />
        <div class="auth-page__bg-overlay"></div>
      </div>

      <div class="auth-page__inner">
        <div class="auth-page__logo"></div>

        <div class="auth-card">
          <div class="card-logo">
            <img src="./assets/images/chill-logo.png" alt="CHILL" />
          </div>
          <h1 class="auth-card__title">Daftar</h1>
          <p class="auth-card__subtitle">Selamat datang!</p>

          <div class="auth-card__form">
            <div class="form-group">
              <label class="form-group__label" for="reg-username">Username</label>
              <input
                class="form-group__input"
                type="text"
                id="reg-username"
                name="username"
                placeholder="Pilih username unikmu"
                autocomplete="username"
              />
            </div>

            <div class="form-group">
              <label class="form-group__label" for="reg-password">Kata Sandi</label>
              <div class="form-group__input-wrap">
                <input
                  class="form-group__input"
                  type="password"
                  id="reg-password"
                  name="password"
                  placeholder="Buat kata sandi yang kuat"
                  autocomplete="new-password"
                />
                <button
                  class="form-group__toggle"
                  type="button"
                  aria-label="Tampilkan kata sandi"
                  onclick="togglePassword('reg-password', this)"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <div class="form-group">
              <label class="form-group__label" for="reg-confirm">Konfirmasi Kata Sandi</label>
              <div class="form-group__input-wrap">
                <input
                  class="form-group__input"
                  type="password"
                  id="reg-confirm"
                  name="confirm_password"
                  placeholder="Ulangi kata sandi"
                  autocomplete="new-password"
                />
                <button
                  class="form-group__toggle"
                  type="button"
                  aria-label="Tampilkan konfirmasi kata sandi"
                  onclick="togglePassword('reg-confirm', this)"
                >
                  <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  >
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                    <circle cx="12" cy="12" r="3" />
                  </svg>
                </button>
              </div>
            </div>

            <p class="auth-card__footer">
              Sudah punya akun?
              <a
                href="#"
                onclick="
                  showPage('login');
                  return false;
                "
                >Masuk</a
              >
            </p>

            <div class="auth-card__actions">
              <button class="btn btn--primary btn--full btn--lg" type="button" onclick="goToHome()">
                Daftar
              </button>
              <div class="divider">atau</div>
              <button class="btn btn--google btn--full btn--lg" type="button">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
                    fill="#4285F4"
                  />
                  <path
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
                    fill="#34A853"
                  />
                  <path
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"
                    fill="#FBBC05"
                  />
                  <path
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
                    fill="#EA4335"
                  />
                </svg>
                Daftar dengan Google
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
